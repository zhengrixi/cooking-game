<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunny Side Diner — a cooking game</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1712; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    display: block;
    width: min(100vw, 177.78vh);
    height: min(56.25vw, 100vh);
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
    touch-action: none;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Sunny Side Diner: stack burgers to order, work the grill and fryer, and serve customers before their patience runs out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
